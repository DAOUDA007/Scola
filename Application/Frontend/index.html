<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Scola</title>
  <meta name="description" content="Scola — la messagerie qui réunit les élèves et étudiants de la même filière et du même niveau.">
  <meta name="theme-color" content="#0e8f7e">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="/css/app.css">
  <script>
    // Thème appliqué avant le rendu pour éviter un flash.
    try { const t = localStorage.getItem('scola.theme'); if (t && t !== 'system') document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <div id="root"><div class="splash"><div class="splash-logo"></div><div class="splash-name">Scola</div><div class="splash-foot">La messagerie de ta classe</div></div></div>
  <div id="layer"></div>
  <div id="call-layer"></div>
  <div id="toasts"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
